version: 2

updates:
  # Rust crates
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "rust"
    groups:
      # One PR for the routine patch/minor noise, individual PRs for majors.
      cargo-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Pinned on purpose: implicit-clone 0.4.2+ builds against a different
      # indexmap major than yew 0.21, which breaks the build. Remove this
      # entry when the project moves to a newer yew. See README.
      - dependency-name: "implicit-clone"
        versions: [">= 0.4.2"]

  # GitHub Actions used by the CI workflow
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Jakarta"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
