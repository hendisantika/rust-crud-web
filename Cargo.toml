[package]
name = "rust-crud-web"
version = "0.1.0"
authors = ["Hendi Santika <hendisantika@yahoo.co.id>"]
edition = "2021"
description = "A client-side CRUD web application built with Rust, Yew and WebAssembly"
license = "MIT"
repository = "https://github.com/hendisantika/rust-crud-web"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
yew = { version = "0.23.0", features = ["csr"] }
serde = { version = "1.0.200", features = ["derive"] }
serde_json = "1.0.116"
gloo-storage = "0.4.0"
wasm-bindgen = "0.2.92"
web-sys = { version = "0.3.77", features = ["HtmlInputElement"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
